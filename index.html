<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>접근 권한 없음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M16 6c4 5 7 9 7 13a7 7 0 1 1-14 0c0-4 3-8 7-13Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --paper:#ffffff;
    --ink:#111111;
    --muted:#6b6b6b;
    --faint:#a3a3a2;
    --line:#e3e3e1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); margin:0;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  main{max-width:420px; width:100%; text-align:center;}
  .badge{
    width:56px; height:56px; margin:0 auto 22px; border-radius:14px;
    background:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .code{font-size:.8rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px;}
  h1{font-size:1.5rem; font-weight:800; margin:0 0 12px; letter-spacing:-.01em;}
  p.desc{font-size:.92rem; line-height:1.65; color:var(--muted); margin:0;}
  footer{margin-top:28px; padding-top:18px; border-top:1px solid var(--line); color:var(--faint); font-size:.78rem;}
</style>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  </div>
  <p class="code">403 Forbidden</p>
  <h1>접근 권한이 없습니다</h1>
  <p class="desc">이 주소는 공개된 페이지가 아닙니다.<br>전달받은 링크로 다시 접속해 주세요.</p>
  <footer>Dr.Petit × Reanhu</footer>
</main>
</body>
</html>
